# BACKGROUND
background {
    monitor =
    path = ~/.background_img
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.5172
    vibrancy = 0.1696
}


# INPUT FIELD
input-field {
    monitor =
    size = 250, 40
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(40, 40, 40, 0.2)
    inner_color = rgba(20, 20, 20, 0.2)
    font_color = rgb(200, 200, 200)
    rounding = 8
    fade_on_empty = false
    font_family = SF Pro Text
    placeholder_text = <span foreground="##ffffff99">Password</span>
    hide_input = false
    position = 0, -25
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 180
    font_family = SF Pro Display
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = SF Pro Display
    position = 0, 105
    halign = center
    valign = center
}

# Profie-Photo
image {
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, -20
    halign = center
    valign = center
}

